            resolved_paths:
              component_path: "/workspace/test_data/common-templates/metrics-server"
              generated_path: "/workspace/test_data/contexts/local/us-west-2/prod/local-cluster-prod/generated/metrics-server"
          nginx:
            name: nginx
            config:
              active: true
              dependencies: []
              for_commit: false
              path: common-templates/nginx
              priority: 1
              required: false
            resolved_paths:
              component_path: "/workspace/test_data/common-templates/nginx"
        custom_key: custom_value04
        environment: prod
        commit_dir: local-generated
        output_dir: output
        path: "/workspace/test_data/contexts/local/us-west-2/prod/local-cluster-prod"
        region: us-west-2
        region_short: usw2
        resolved_paths:
          context_path: "/workspace/test_data/contexts/local/us-west-2/prod/local-cluster-prod"
          commit_dir: "/workspace/test_data/contexts/local/us-west-2/prod/local-cluster-prod/local-generated"
        workspace: local
        workspaces:
          - name: local
            archive_dir: archive
            context_config_files:
              - "**/*local*values.yaml"
            context_type: cluster
            output_dir: output
            workspace_dir: local
            custom_key: custom_value00
