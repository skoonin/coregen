# Example for `coregen get w/* --output yaml --format flat`
# If user adds `--type <entity>`, only that entity will be included in the output.
workspaces:
  - name: aws # Name is always first field
    archive_dir: archive
    context_config_files:
      - "**/*aws*values.yaml"
    context_type: cluster
    output_dir: output
    workspace_dir: clusters
    # All custom fields are included and sorted with other fields alphabetically
    custom_field: custom value
    contexts:
      - name: aws-cluster-prod
        active: true
        archive_dir: archive
        component_type: app
        env: prod
        environment: prod
        commit_dir: generated
        output_dir: output
        workspace: aws
        _config_file_path: /Users/shawnk/git/coregen/test_data/clusters/aws/us-west-2/prod/aws-cluster-prod/aws-cluster-prod-values.yaml
        # All custom fields are included and sorted with other fields alphabetically
