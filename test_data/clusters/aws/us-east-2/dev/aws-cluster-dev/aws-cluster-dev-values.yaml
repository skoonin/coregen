cluster:
  name: aws-cluster-dev
  environment: dev
  active: true
  account_id: 04000000
  component_type: app
  root_dir: clusters
  region_short: use2
  region: us-east-2
  app:
    - name: prometheus
      config:
        active: true
        for_commit: false
        path: common-templates/prometheus
        priority: "0"
        required: false
      vars:
        helm_chart_version: 0.9.1
        crd_chart_version: 0.1.0
    - name: metrics-server
      config:
        for_commit: true
        active: true
        path: common-templates/metrics-server
    - name: nginx
      config:
        active: true
        path: clusters/aws/us-west-2/prod/aws-cluster-prod/service/nginx
