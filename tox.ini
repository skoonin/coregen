# Tox configuration for Coregen
#
# Environment Isolation:
#
# All environments use the existing test_data/ directory directly for simplicity.
# Developers can modify test_data/ and test changes locally.
# CI uses the same test_data/ for consistency.
#
# Available test environments:
#   - Standard testing: tox, tox -e py311
#   - E2E testing: tox -e test-e2e
#   - CI simulation: tox -e test-ci-e2e, test-ci-cli
#   - Isolated testing: tox -e isolated (separate temp directory)

[tox]
envlist = py311,lint,type,coverage
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest
    pytest-timeout
commands =
    pytest {posargs:tests/}
allowlist_externals = pytest
setenv =
    PYTHONPATH = {toxinidir}/source
    _TYPER_FORCE_DISABLE_TERMINAL = 1
passenv =
    HOME
    USER
    CI
    GITHUB_*
# By default, tests use the existing test_data directory
# This allows developers to modify test_data and test their changes

[testenv:py311]
basepython = python3.11

[testenv:coverage]
deps =
    {[testenv]deps}
    coverage[toml]
commands =
    coverage run -m pytest {posargs:tests/}
    coverage report
    coverage html

[testenv:lint]
deps =
    -e .[dev]  # Use dev dependencies from pyproject.toml
commands =
    black --check source tests .ci-tools .
    isort --check-only source tests
    flake8 source tests
    pylint --errors-only source
    bandit -r source -ll --skip B701  # B701: autoescape selected per output type in generator.py

[testenv:type]
deps =
    -e .[dev]  # Use dev dependencies from pyproject.toml
commands =
    mypy source

[testenv:format]
deps =
    -e .[dev]  # Use dev dependencies from pyproject.toml
commands =
    black source tests
    isort source tests

[testenv:lint-verbose]
# Run linting with more readable output format
deps =
    -e .[dev]  # Use dev dependencies from pyproject.toml
commands =
    black --check source tests .ci-tools .
    isort --check-only source tests .ci-tools .
    flake8 source tests --format='%(path)s:%(row)d:%(col)d: [%(code)s] %(text)s'
    pylint source --msg-template='{path}:{line}:{column}: [{msg_id}] {msg} ({symbol})' --exit-zero

[testenv:format-check]
deps =
    -e .[dev]  # Use dev dependencies from pyproject.toml
commands =
    black --check source tests .ci-tools .
    isort --check-only source tests

# Testing environments for different test categories
[testenv:test-unit]
deps = {[testenv]deps}
commands = pytest --tb=short --no-header --disable-warnings -v tests/test_common/

[testenv:test-services]
deps = {[testenv]deps}
commands = pytest --tb=short --no-header --disable-warnings -v --timeout=120 tests/test_services/

[testenv:test-cli]
deps = {[testenv]deps}
commands = pytest --tb=short --no-header --disable-warnings -v tests/test_cli/

[testenv:test-config]
deps = {[testenv]deps}
commands = pytest --tb=short --no-header --disable-warnings -v tests/test_config_model/

[testenv:test-e2e]
deps = {[testenv]deps}
commands =
    pytest --tb=short --no-header --disable-warnings -v --timeout=300 tests/test_e2e/

# Parallel test execution
[testenv:test-parallel]
deps =
    {[testenv]deps}
    pytest-xdist
commands = pytest {posargs:tests/} -n auto

[testenv:test-parallel-quiet]
deps =
    {[testenv]deps}
    pytest-xdist
commands = pytest -q --tb=no --capture=fd -s tests/ -n auto

# Verbose test execution
[testenv:test-verbose]
deps = {[testenv]deps}
commands = pytest --capture=fd -s -v {posargs:tests/}

# Pattern-based testing
[testenv:test-pattern]
deps = {[testenv]deps}
commands = pytest -q --tb=no --capture=fd -s -k "{env:PATTERN:}" tests/

# CI-specific environments (no macOS-specific tests)
[testenv:test-ci]
deps = {[testenv]deps}
commands = pytest -q -m "not platform_macos" {posargs:tests/}

[testenv:test-ci-unit]
deps = {[testenv]deps}
commands = pytest -q -m "not platform_macos" tests/test_common/

[testenv:test-ci-services]
deps = {[testenv]deps}
commands = pytest -q -m "not platform_macos" --timeout=120 tests/test_services/

[testenv:test-ci-cli]
deps = {[testenv]deps}
setenv =
    {[testenv]setenv}
commands = pytest -q -m "not platform_macos" tests/test_cli/

[testenv:test-ci-config]
deps = {[testenv]deps}
commands = pytest -q -m "not platform_macos" tests/test_config_model/

[testenv:test-ci-e2e]
deps = {[testenv]deps}
setenv =
    {[testenv]setenv}
commands =
    pytest -q -m "not platform_macos" --timeout=300 tests/test_e2e/

# HTML report generation
[testenv:test-html]
deps =
    {[testenv]deps}
    pytest-html
commands =
    python -c "import shutil; shutil.rmtree('test_reports', ignore_errors=True)"
    python -c "import os; os.makedirs('test_reports', exist_ok=True)"
    pytest --capture=fd -s --color=no tests/ --html=test_reports/report.html --self-contained-html

[testenv:clean]
deps =
commands =
    python -c "import shutil; shutil.rmtree('htmlcov', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.coverage', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.pytest_cache', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.tox', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('build', ignore_errors=True)"
    python -c "import pathlib; [p.unlink() for p in pathlib.Path('.').rglob('*.pyc')]"
    python -c "import pathlib; [p.rmdir() for p in pathlib.Path('.').rglob('__pycache__')]"
allowlist_externals =
    python

# Special environment for e2e tests (uses existing test_data)
[testenv:e2e]
deps = {[testenv]deps}
commands =
    pytest tests/test_e2e/ -v

# Fresh test data environment - uses existing clean test_data
[testenv:fresh]
deps = {[testenv]deps}
commands =
    pytest {posargs:tests/}

# CI environment - uses existing clean test_data
[testenv:ci]
deps = {[testenv]deps}
commands =
    pytest tests/ --tb=short --no-header -v

# Isolated environment - runs tests in a completely separate directory
[testenv:isolated]
deps = {[testenv]deps}
changedir = {envtmpdir}
commands_pre =
    # Copy only necessary files to isolated environment
    python -c "import shutil; shutil.copytree('{toxinidir}/source', 'source')"
    python -c "import shutil; shutil.copytree('{toxinidir}/tests', 'tests')"
    python -c "import shutil; shutil.copytree('{toxinidir}/test_data', 'test_data')"
    python -c "import shutil; shutil.copy2('{toxinidir}/pyproject.toml', '.')"
    python -c "import shutil; shutil.copy2('{toxinidir}/conftest.py', '.')"
setenv =
    PYTHONPATH = {envtmpdir}/source
commands =
    pytest tests/ -v
allowlist_externals =
    python

# Demo environment to show isolation benefits
[testenv:demo-isolation]
deps = {[testenv]deps}
commands =
    python -c "print('=== Tox Environment Isolation Demo ===')"
    python -c "import sys; print(f'Python: {{sys.executable}}')"
    python -c "import os; print(f'Working dir: {{os.getcwd()}}')"
    python -c "import site; print(f'Site packages: {{site.getsitepackages()[0]}}')"
    python -c "print('\\nInstalled packages:')"
    pip list --format=columns
    python -c "print('\\nEnvironment variables:')"
    python -c "import os; [print(f'{{k}}={{v}}') for k,v in sorted(os.environ.items()) if 'TOX' in k or 'VIRTUAL' in k]"
